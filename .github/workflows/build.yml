name: Build HiaTranslator APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files and Inject Internet Permission
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --platforms=android --org com.tnk.translator .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          t = open(p).read()
          o, c = chr(60), chr(62)
          perms = f"{o}uses-permission android:name=\"android.permission.INTERNET\"/{c}\n    {o}uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/{c}\n    "
          t = t.replace(f"{o}application", perms + f"{o}application android:usesCleartextTraffic=\"true\"", 1)
          open(p, "w").write(t)
          '
          grep "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies and Fix Proguard
        run: |
          flutter pub get
          find ~/.pub-cache -name "build.gradle*" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: TNK-Translator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
