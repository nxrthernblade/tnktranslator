name: Build HiaTranslator APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files Safely
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --platforms=android --org com.tnk.translator .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          sed -i '/\x3capplication/i \x3cuses-permission android:name="android.permission.INTERNET"/\x3e' android/app/src/main/AndroidManifest.xml
          sed -i 's/\x3capplication/\x3capplication android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies & Fix InAppWebView Proguard Bug
        run: |
          flutter pub get
          find ~/.pub-cache -name "build.gradle*" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: TNK-Translator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
